<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Lado izquierdo -->
    <div class="left-side">
      <h1 class="logo">SKILLSWAP</h1>

      <!-- Botón Google -->
      <button class="google-btn">
        <img src="imagenes/googleicon.png" alt="Google">
        Ingresar con Google
      </button>

      <!-- Separador -->
      <div class="separator">
        <span></span>
        <p>O MEJOR</p>
        <span></span>
      </div>

      <!-- Formulario -->
      <form id="loginForm" class="form">
        <label for="email">CORREO ELECTRÓNICO</label>
        <input type="text" id="email" placeholder="Correo o Usuario">

        <label for="password">CONTRASEÑA</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Contraseña">
          <img src="imagenes/ojoopen.png" id="togglePassword" alt="Toggle Password">
        </div>
       

    

    <p class="register-text">
        ¿No tienes una cuenta?
    <a href="registro.html" class="register-link"> Ingresa aquí.</a>
    </p>

        <button type="submit" class="login-btn">Iniciar Sesión</button>
        <a href="#" class="forgot">Olvidé mi contraseña</a>
      </form>

      <!-- Legal -->
      <p class="legal">
        Al registrarte en <span class="highlight">SkillSwap</span>, aceptas nuestros
        <span class="highlight">Términos</span> y <span class="highlight">Privacidad</span>.
      </p>
    </div>

    <!-- Lado derecho -->
    <div class="right-side"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
